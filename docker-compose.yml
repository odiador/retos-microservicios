#version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: retos-postgres
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build: ./auth
    ports:
      - "3500:3500"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notifications:
    build: ./sms
    ports:
      - "6379:6379"
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build: ./notiorchestrator
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - SERVER_PORT=8080
      - LOG_LEVEL_ORCHESTRATOR=DEBUG
      - LOG_LEVEL_SPRING_AMQP=DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  rabbitmq:
    build: ./rabbitmq
    container_name: retos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./.env
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-securepass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - AUTH_EVENTS_EXCHANGE=${AUTH_EVENTS_EXCHANGE:-auth.events}
      - ORCHESTRATOR_QUEUE=${ORCHESTRATOR_QUEUE:-orchestrator.queue}
      - MESSAGING_EMAIL_QUEUE=${MESSAGING_EMAIL_QUEUE:-messaging.email.queue}
      - MESSAGING_SMS_QUEUE=${MESSAGING_SMS_QUEUE:-messaging.sms.queue}
      - AUTH_AUDIT_QUEUE=${AUTH_AUDIT_QUEUE:-auth.audit.queue}
      - USER_ROUTING_KEY=${USER_ROUTING_KEY:-user.*}
      - PASSWORD_ROUTING_KEY=${PASSWORD_ROUTING_KEY:-password.*}
      - SEND_EMAIL_ROUTING_KEY=${SEND_EMAIL_ROUTING_KEY:-send.email}
      - SEND_SMS_ROUTING_KEY=${SEND_SMS_ROUTING_KEY:-send.sms}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

volumes:
  dbdata:
  rabbitmq_data:
