#version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: retos-postgres
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build: ./auth
    ports:
      - "3500:3500"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notifications:
    build: ./sms
    ports:
      - "6379:6379"
    env_file:
      - ./.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  orchestrator:
    build: ./notiorchestrator
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_RABBITMQ_HOST=rabbitmq
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - SERVER_PORT=8080
      - LOG_LEVEL_ORCHESTRATOR=DEBUG
      - LOG_LEVEL_SPRING_AMQP=DEBUG
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  rabbitmq:
    build:
      context: .
      dockerfile: rabbitmq/Dockerfile
    container_name: retos-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - ./.env
    environment:
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-securepass}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - AUTH_EVENTS_EXCHANGE=${AUTH_EVENTS_EXCHANGE:-auth.events}
      - ORCHESTRATOR_QUEUE=${ORCHESTRATOR_QUEUE:-orchestrator.queue}
      - MESSAGING_EMAIL_QUEUE=${MESSAGING_EMAIL_QUEUE:-messaging.email.queue}
      - MESSAGING_SMS_QUEUE=${MESSAGING_SMS_QUEUE:-messaging.sms.queue}
      - AUTH_AUDIT_QUEUE=${AUTH_AUDIT_QUEUE:-auth.audit.queue}
      - USER_ROUTING_KEY=${USER_ROUTING_KEY:-user.*}
      - PASSWORD_ROUTING_KEY=${PASSWORD_ROUTING_KEY:-password.*}
      - SEND_EMAIL_ROUTING_KEY=${SEND_EMAIL_ROUTING_KEY:-send.email}
      - SEND_SMS_ROUTING_KEY=${SEND_SMS_ROUTING_KEY:-send.sms}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # ============================================
  # JENKINS - Motor de Integración Continua
  # ============================================
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: retos-jenkins
    user: root
    ports:
      - "8090:8080"      # Jenkins Web UI
      - "50000:50000"    # Jenkins Agent
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

    depends_on:
      sonarqube:
        condition: service_healthy

  # ============================================
  # SONARQUBE - Análisis de Calidad de Código
  # ============================================
  sonarqube:
    image: sonarqube:10-community
    container_name: retos-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonar-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=${SONAR_DB_USER:-sonar}
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASS:-sonar}
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy

  # ============================================
  # SONAR-DB - Base de datos para SonarQube
  # ============================================
  sonar-db:
    image: postgres:16-alpine
    container_name: retos-sonar-db
    environment:
      - POSTGRES_USER=${SONAR_DB_USER:-sonar}
      - POSTGRES_PASSWORD=${SONAR_DB_PASS:-sonar}
      - POSTGRES_DB=sonarqube
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============================================
  # STACK DE OBSERVABILIDAD
  # ============================================
  loki:
    image: grafana/loki:2.9.2
    container_name: retos-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki/data:/loki
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    container_name: retos-promtail
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./observability/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.1
    container_name: retos-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped

  monitor:
    build: ./monitor
    container_name: retos-monitor
    ports:
      - "8085:8085"
    env_file:
      - ./.env
    depends_on:
      auth:
        condition: service_started
      orchestrator:
        condition: service_started
    restart: unless-stopped

    api-gateway:
      build: ./api-gateway
      container_name: retos-api-gateway
      ports:
        - "8000:8000"
      environment:
        - GATEWAY_PORT=8000
        - AUTH_SERVICE_URL=http://auth:3500
        - PROFILE_SERVICE_URL=http://profiles:3600
        - ORCHESTRATOR_URL=http://orchestrator:8080
        - JWT_SECRET=${JWT_SECRET}
      depends_on:
        - auth
        - orchestrator
      restart: unless-stopped
      networks:
        - microservices-network

  networks:
    microservices-network:
      driver: bridge

volumes:
  dbdata:
  rabbitmq_data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonar_db_data:
  grafana_data:
  loki_data:
  
