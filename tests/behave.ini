[behave]
# Behave configuration for BDD tests

# Paths
paths = feature

# Output format
format = pretty
show_timings = true
show_skipped = false

# Logging
logging_level = INFO
logging_clear_handlers = true
logging_filter = -urllib3

# Test behavior
stop = false
dry_run = false
tags =

# Reporting
junit = true
junit_directory = ../test-results/bdd

# Color output
color = true

# Language
lang = es