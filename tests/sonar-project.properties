# SonarQube configuration for BDD Tests
sonar.projectKey=microservices-bdd-tests
sonar.projectName=Microservices BDD Tests
sonar.projectVersion=1.0.0

# Source code
sonar.sources=steps
sonar.sourceEncoding=UTF-8
sonar.language=py

# Tests
sonar.tests=feature
sonar.test.inclusions=**/*.feature

# Exclusions
sonar.exclusions=**/venv/**,**/__pycache__/**,**/.pytest_cache/**

# Python specific
sonar.python.version=3.11

# Coverage (if using coverage tool)
sonar.python.coverage.reportPaths=../test-results/coverage.xml

# Quality Gates
sonar.qualitygate.wait=true